<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">WebGyre profile mark</title>
  <desc id="desc">An orange striped gyre and orbit on a dark background.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#1C0B04"/>
      <stop offset="0.58" stop-color="#0C0D10"/>
      <stop offset="1" stop-color="#08090B"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FE4301" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FE4301" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sphere">
      <circle cx="250" cy="264" r="120"/>
    </clipPath>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#background)"/>
  <circle cx="256" cy="256" r="220" fill="url(#halo)"/>
  <circle cx="256" cy="256" r="216" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="256" cy="256" r="194" fill="none" stroke="#FE4301" stroke-opacity="0.12"/>

  <g transform="rotate(-31 250 264)" clip-path="url(#sphere)" fill="#FE4301">
    <rect x="65" y="126" width="390" height="24" rx="12"/>
    <rect x="65" y="165" width="390" height="31" rx="15.5"/>
    <rect x="65" y="214" width="390" height="34" rx="17"/>
    <rect x="65" y="266" width="390" height="34" rx="17"/>
    <rect x="65" y="318" width="390" height="31" rx="15.5"/>
    <rect x="65" y="367" width="390" height="24" rx="12"/>
  </g>

  <ellipse cx="250" cy="264" rx="178" ry="70" transform="rotate(-31 250 264)" fill="none" stroke="#FE4301" stroke-width="12" filter="url(#glow)"/>
  <ellipse cx="250" cy="264" rx="178" ry="70" transform="rotate(-31 250 264)" fill="none" stroke="#FF9A71" stroke-opacity="0.75" stroke-width="3"/>

  <circle cx="394" cy="118" r="14" fill="#FE4301" filter="url(#glow)"/>
  <circle cx="426" cy="83" r="7" fill="#FF9A71"/>
  <circle cx="355" cy="88" r="5" fill="#FE4301"/>
  <circle cx="92" cy="402" r="10" fill="#FE4301"/>
  <circle cx="64" cy="430" r="5" fill="#FF9A71"/>
</svg>
