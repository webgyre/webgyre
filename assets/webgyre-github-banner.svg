<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">WebGyre</title>
  <desc id="desc">Websites built for real business. Design, development and ecommerce from Parbhani for businesses across India.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090B"/>
      <stop offset="0.58" stop-color="#0D0F13"/>
      <stop offset="1" stop-color="#160802"/>
    </linearGradient>
    <radialGradient id="flare" cx="82%" cy="42%" r="58%">
      <stop offset="0" stop-color="#FE4301" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FE4301" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FE4301" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="sphere">
      <circle cx="1052" cy="206" r="104"/>
    </clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#background)"/>
  <rect width="1280" height="420" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="28" fill="url(#flare)"/>
  <rect x="1" y="1" width="1278" height="418" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.1"/>

  <g opacity="0.5">
    <path d="M0 330C126 277 215 277 340 340S574 403 692 329" fill="none" stroke="#FE4301" stroke-opacity="0.22"/>
    <path d="M0 349C126 296 215 296 340 359S574 422 692 348" fill="none" stroke="#FE4301" stroke-opacity="0.12"/>
    <path d="M0 368C126 315 215 315 340 378S574 441 692 367" fill="none" stroke="#FE4301" stroke-opacity="0.07"/>
  </g>

  <g transform="translate(74 58)">
    <g transform="translate(0 1)">
      <circle cx="31" cy="31" r="29" fill="#FE4301" fill-opacity="0.08" stroke="#FE4301" stroke-opacity="0.4"/>
      <g transform="translate(5 5) scale(.52)">
        <defs>
          <clipPath id="small-sphere"><circle cx="48" cy="53" r="33"/></clipPath>
        </defs>
        <g clip-path="url(#small-sphere)">
          <g transform="rotate(-32 48 53)" fill="#FE4301">
            <rect x="-10" y="20" width="120" height="9" rx="4.5"/>
            <rect x="-10" y="34" width="120" height="11" rx="5.5"/>
            <rect x="-10" y="50" width="120" height="11" rx="5.5"/>
            <rect x="-10" y="66" width="120" height="9" rx="4.5"/>
            <rect x="-10" y="79" width="120" height="6" rx="3"/>
          </g>
        </g>
        <ellipse cx="48" cy="53" rx="46" ry="18" transform="rotate(-32 48 53)" fill="none" stroke="#FE4301" stroke-width="4.5"/>
      </g>
    </g>
    <text x="82" y="39" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" letter-spacing="-1.2">Web<tspan fill="#FE4301">Gyre</tspan></text>
    <text x="83" y="59" fill="#9CA3AF" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="4.5">DESIGN  DEVELOP  GROW</text>
  </g>

  <g transform="translate(76 157)">
    <rect width="124" height="28" rx="14" fill="#FE4301" fill-opacity="0.1" stroke="#FE4301" stroke-opacity="0.45"/>
    <circle cx="17" cy="14" r="4" fill="#FE4301"/>
    <text x="29" y="18" fill="#FFB293" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">SERVING INDIA</text>
  </g>

  <text x="74" y="242" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="800" letter-spacing="-2.3">Websites built for</text>
  <text x="74" y="304" fill="#FE4301" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="800" letter-spacing="-2.3">real business.</text>
  <text x="77" y="352" fill="#A7ABB3" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="0.5">WORDPRESS  /  CUSTOM CODE  /  ECOMMERCE</text>

  <g transform="rotate(-29 1052 206)" clip-path="url(#sphere)" fill="#FE4301">
    <rect x="892" y="91" width="330" height="19" rx="9.5"/>
    <rect x="892" y="121" width="330" height="25" rx="12.5"/>
    <rect x="892" y="160" width="330" height="28" rx="14"/>
    <rect x="892" y="203" width="330" height="28" rx="14"/>
    <rect x="892" y="246" width="330" height="25" rx="12.5"/>
    <rect x="892" y="285" width="330" height="19" rx="9.5"/>
  </g>
  <ellipse cx="1052" cy="206" rx="151" ry="58" transform="rotate(-29 1052 206)" fill="none" stroke="#FE4301" stroke-width="8" filter="url(#glow)"/>
  <ellipse cx="1052" cy="206" rx="151" ry="58" transform="rotate(-29 1052 206)" fill="none" stroke="#FF8A5B" stroke-opacity="0.7" stroke-width="2"/>
  <circle cx="1174" cy="92" r="10" fill="#FE4301" filter="url(#glow)"/>
  <circle cx="1203" cy="62" r="5" fill="#FF8A5B"/>
  <circle cx="1139" cy="68" r="4" fill="#FE4301"/>
  <circle cx="912" cy="337" r="7" fill="#FE4301"/>
  <circle cx="887" cy="359" r="4" fill="#FF8A5B"/>

  <g transform="translate(1000 351)">
    <circle cx="0" cy="0" r="3" fill="#FE4301"/>
    <text x="13" y="5" fill="#C6C8CE" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1.2">PARBHANI, MAHARASHTRA</text>
  </g>
</svg>
